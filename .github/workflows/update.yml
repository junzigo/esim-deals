name: Check official eSIM offers
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - '.ilang/**'
      - 'templates/**'
      - 'assets/**'
      - 'agent/**'
      - 'package*.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: official-offer-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test integrity rules
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test read-only agent service
        run: |
          npm ci
          npm run test:agent
      - name: Read public official sources
        run: python scraper.py
      - name: Build and validate site
        run: |
          python build.py
          python validate.py
          npm run build:agent
      - name: Commit source observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official source observations'
            git push
          fi
